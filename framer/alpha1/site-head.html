<!--
  Tabit XR3.0 (13 Nov 2026): site-wide head snippet, in Framer as a Custom Code snippet "Tabit: phone width (XR3.0)",
  placement End of <head>, all pages, runs on every page visit. Keep this file and the snippet identical.

  Why: every page has only a Desktop breakpoint, so Framer writes <meta name="viewport" content="width=1200">.
  A phone obeys it: it lays the page out 1,200 px wide and shrinks it to fit, so the site never sees a phone
  (Oscar on his phone, 13 Nov: everything tiny, the phone build not showing). This snippet sets the page to the
  device's own width: a second viewport tag (the last one wins), and a line that rewrites Framer's own tag in place.
  Desktop browsers ignore viewport tags, so nothing changes on a computer. Tablets now lay out at their own width
  (768 to 1,024 px: the stacked layout) instead of the desktop design shrunk.
-->
<meta name="viewport" content="width=device-width, initial-scale=1"><script>(function(){var c="width=device-width, initial-scale=1";var m=document.querySelectorAll('meta[name="viewport"]');for(var i=0;i<m.length;i++){if(m[i].getAttribute("content")!==c)m[i].setAttribute("content",c);}})();</script>
